<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>J-me</title>
<style>
  html, body { margin: 0; height: 100%; background: #0f1115; color: #e8e8ec; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; }
  .src { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-bottom: 1px solid #262a33; }
  .sw { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
  .sw input { appearance: none; width: 36px; height: 20px; border-radius: 10px; background: #262a33; position: relative; cursor: pointer; margin: 0; transition: background .2s; }
  .sw input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #8a8f9c; transition: left .2s, background .2s; }
  .sw input:checked { background: #f2b84b; } .sw input:checked::after { left: 18px; background: #111; }
  #state { flex: 1; color: #8a8f9c; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #settings { color: #8a8f9c; font-size: 12px; text-decoration: none; } #settings:hover { color: #e8e8ec; }
  #jme-root { flex: 1; min-height: 0; }
</style>
</head>
<body>
  <div class="src">
    <label class="sw"><input type="checkbox" id="mic"> Microphone</label>
    <span id="state"></span>
    <a id="settings" href="#" title="Settings">⚙</a>
  </div>
  <div id="jme-root"></div>
  <script src="overlay.js"></script>
  <script src="panel.js"></script>
</body>
</html>
